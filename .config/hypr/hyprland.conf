# Source order matters: monitors → workspaces → visuals → autostart.
# `autostart.conf`'s `hyprctl dispatch workspace 1` only lands on the
# right monitor once `workspace = N, monitor:M` rules in workspaces.conf
# have been applied (Hyprland fires exec-once in parse order, before
# the final config phase). Same for visuals.conf — its per-class
# `workspace special:* silent` windowrules must be in effect before
# autostart spawns Spotify/Discord/etc. so they land on their pinned
# specials and not as rogues.
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/visuals.conf
source = ~/.config/hypr/conf/workspaces.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/autostart.conf

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true
    split_width_multiplier = 1.25
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    allow_session_lock_restore = 1
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
source = ~/.config/hypr/conf/input.conf


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
source = ~/.config/hypr/conf/keybinds.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# SUPER KEY
$mainMod = SUPER
$TERMINAL = kitty
$BROWSER = google-chrome-stable
$FILES = nautilus --new-window
$CALCULATOR = gnome-calculator

# Applications
bind = $mainMod, RETURN, exec, $TERMINAL    # Open the terminal
bind = $mainMod, B, exec, $BROWSER          # Open the browser
bind = $mainMod, E, exec, $FILES      # Open the filemanager
bind = $mainMod CTRL, C, exec, $CALCULATOR # Open the calculator
# Toggle the per-app special workspace if the app is already running,
# otherwise launch it. See scripts/toggle-or-launch.sh — args are
# <window class> <special workspace name> <launch command>.
$toggleOrLaunch = ~/.config/hypr/scripts/toggle-or-launch.sh
bind = $mainMod, D, exec, $toggleOrLaunch discord discord discord
bind = $mainMod, S, exec, $toggleOrLaunch spotify spotify spotify-launcher
bind = $mainMod, G, exec, $toggleOrLaunch "GitHub Desktop" github github-desktop
bind = $mainMod SHIFT, W, exec, livepaper --kill # Kill wallpaper
bind = $mainMod, R, exec, livepaper --action=random # Random wallpaper
bind = $mainMod, N, exec, livepaper --action=next-wallpaper # Next wallpaper
bind = $mainMod, P, exec, livepaper --action=previous-wallpaper # Previous wallpaper
bind = $mainMod, W, exec, $toggleOrLaunch livepaper livepaper livepaper # Open wallpaper manager

# Windows
$smartKill = ~/.config/hypr/scripts/smart-kill.sh
bind = $mainMod, Q, exec, $smartKill                                                        # Kill active window (or hide if on a special workspace)
bind = $mainMod, F, fullscreen, 0                                                           # Set active window to fullscreen
bind = $mainMod, M, fullscreen, 1                                                           # Maximize Window
bind = $mainMod, T, togglefloating                                                          # Toggle active windows into floating mode
bind = $mainMod, H, movefocus, l							    # Move focus left
bind = $mainMod, L, movefocus, r                                                            # Move focus right
bind = $mainMod, K, movefocus, u                                                            # Move focus up
bind = $mainMod, J, movefocus, d                                                            # Move focus down
# Window-move wrapper: NOPs when the active window is on a special
# workspace, so per-app special tray windows (discord, spotify, term,
# …) can't be ripped off their pinned overlay via keybind. bindm
# (mouse drag) can't be wrapped — Hyprland's bindm only accepts
# movewindow/resizewindow, not exec — that path is caught after-the-
# fact by special-workspace-guard.sh's snap-back.
$guardMove = ~/.config/hypr/scripts/guard-move.sh
bindm = $mainMod, mouse:272, movewindow                                                     # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow                                                   # Resize window with the mouse
bind = $mainMod ALT, H, exec, $guardMove swapwindow l                                       # Swap tiled window left
bind = $mainMod ALT, L, exec, $guardMove swapwindow r                                       # Swap tiled window right
bind = $mainMod ALT, K, exec, $guardMove swapwindow u                                       # Swap tiled window up
bind = $mainMod ALT, J, exec, $guardMove swapwindow d                                       # Swap tiled window down
binde = ALT,Tab,cyclenext                                                                   # Cycle between windows
binde = ALT,Tab,bringactivetotop                                                            # Bring active window to the top

# Actions
bind = , PRINT, exec, ~/dotfiles/scripts/screenshot.sh selection 1 1                        # Take a screenshot (selection)
bind = $mainMod, PRINT, exec, ~/dotfiles/scripts/screenshot.sh selection 1 1                # Take a screenshot (selection)
bind = $mainMod SHIFT, S, exec, ~/dotfiles/scripts/screenshot.sh selection 1 1              # Take a screenshot (selection)
bind = $mainMod CTRL, RETURN, exec, qs ipc call launcher toggle                             # Open application launcher
bind = $mainMod, GRAVE, exec, $toggleOrLaunch kitty-special term kitty --class=kitty-special # Drop-down terminal
bind = $mainMod, ESCAPE, exec, $toggleOrLaunch kitty-special term kitty --class=kitty-special # Drop-down terminal
bind = $mainMod CTRL, L, exec, qs ipc call lock lock                                        # Lock session
bind = $mainMod ALT, L, exec, qs ipc call lock lock                                         # Lock session

# Workspaces
bind = $mainMod, 1, workspace, 1  # Open workspace 1
bind = $mainMod, 2, workspace, 2  # Open workspace 2
bind = $mainMod, 3, workspace, 3  # Open workspace 3
bind = $mainMod, 4, workspace, 4  # Open workspace 4
bind = $mainMod, 5, workspace, 5  # Open workspace 5
bind = $mainMod, 6, workspace, 6  # Open workspace 6
bind = $mainMod, 7, workspace, 7  # Open workspace 7
bind = $mainMod, 8, workspace, 8  # Open workspace 8
bind = $mainMod, 9, workspace, 9  # Open workspace 9
bind = $mainMod, 0, workspace, 10 # Open workspace 10

bind = $mainMod SHIFT, 1, exec, $guardMove movetoworkspace 1  # Move active window to workspace 1
bind = $mainMod SHIFT, 2, exec, $guardMove movetoworkspace 2  # Move active window to workspace 2
bind = $mainMod SHIFT, 3, exec, $guardMove movetoworkspace 3  # Move active window to workspace 3
bind = $mainMod SHIFT, 4, exec, $guardMove movetoworkspace 4  # Move active window to workspace 4
bind = $mainMod SHIFT, 5, exec, $guardMove movetoworkspace 5  # Move active window to workspace 5
bind = $mainMod SHIFT, 6, exec, $guardMove movetoworkspace 6  # Move active window to workspace 6
bind = $mainMod SHIFT, 7, exec, $guardMove movetoworkspace 7  # Move active window to workspace 7
bind = $mainMod SHIFT, 8, exec, $guardMove movetoworkspace 8  # Move active window to workspace 8
bind = $mainMod SHIFT, 9, exec, $guardMove movetoworkspace 9  # Move active window to workspace 9
bind = $mainMod SHIFT, 0, exec, $guardMove movetoworkspace 10 # Move active window to workspace 10

bind = $mainMod, Tab, workspace, m+1       # Open next workspace
bind = $mainMod SHIFT, Tab, workspace, m-1 # Open previous workspace

bind = $mainMod CTRL, right, workspace, m+1       # Open next workspace
bind = $mainMod CTRL, left, workspace, m-1 # Open previous workspace

bind = $mainMod, mouse_down, workspace, e+1  # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1    # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty # Open the next empty workspace
bind = $mainMod CTRL, J, workspace, empty # Open the next empty workspace

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause

exec-once = mpris-proxy

env = SDL_VIDEODRIVER,wayland

source = ~/.config/hypr/conf/colors.conf

general {
    gaps_in = 4
    gaps_out = 8
    layout = dwindle
    resize_on_border = false
    border_size = 1
    # accent-driven focus border (regenerated on theme switch via render_configs.sh)
    col.active_border = $ACCENT
    col.inactive_border = rgba(00000000)
    # RGB border (kept for reference)
    # col.active_border = rgba(ff0000ff) rgba(ff7f00ff) rgba(ffff00ff) rgba(00ff00ff) rgba(0000ffff) rgba(8B00ffff) 60deg
}

decoration {
    shadow {
        enabled = false
        range = 4
        render_power = 2
        color = 0xee1a1a1a
        color_inactive = 0xee1a1a1a
    }

    #inactive_opacity = 0.60
    #active_opacity = 0.80
    fullscreen_opacity = 1.00
    rounding = 16
    
    blur {
        enabled = true
        size = 6
        noise = 0.00
        passes = 2
        new_optimizations = true
        xray = false
        vibrancy_darkness = 1.0
        popups = true
        popups_ignorealpha = 0.20
        ignore_opacity = true
    }
}

animations {
    enabled = true
}

misc {
    vfr = false
}

opengl {
    nvidia_anti_flicker = true
}

# Quickshell layers (bar, theme switcher, notifications, app launcher)
layerrule = blur on, match:namespace quickshell
layerrule = ignore_alpha 0, match:namespace quickshell
layerrule = blur_popups on, match:namespace quickshell

# Pavucontrol floating
windowrule = float on, match:class .*org.pulseaudio.pavucontrol.*
windowrule = size 700 600, match:class .*org.pulseaudio.pavucontrol.*
windowrule = center on, match:class .*org.pulseaudio.pavucontrol.*
windowrule = pin on, match:class .*org.pulseaudio.pavucontrol.*

# Waypaper
windowrule = float on, match:class .*waypaper.*
windowrule = size 900 700, match:class .*waypaper.*
windowrule = center on, match:class .*waypaper.*
windowrule = pin on, match:class .*waypaper.*

# Blueman Manager
windowrule = float on, match:class blueman-manager
windowrule = size 800 600, match:class blueman-manager
windowrule = center on, match:class blueman-manager

# Gnome Calculator
windowrule = float on, match:class org.gnome.Calculator
windowrule = size 700 600, match:class org.gnome.Calculator
windowrule = center on, match:class org.gnome.Calculator

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT (qt6ct wins for Qt6 apps including Quickshell — keep this last)
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# Quickshell resolves desktop-entry icons via QIcon::fromTheme. qt6ct
# integration isn't always reliable for non-widget Qt apps, so set the icon
# theme directly so the AppLauncher matches GTK apps like nwg-drawer.
env = QT_ICON_THEME,Colloid-Dark

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

env = WLR_DRM_NO_ATOMIC,1

env = GTK_THEME,catppuccin-mocha-mauve-standard+default

# Discord
windowrule = float on, match:class discord
windowrule = size 1650 900, match:class discord
windowrule = center on, match:class discord
windowrule = workspace special:discord silent, match:class discord

# Spotify
windowrule = float on, match:class Spotify
windowrule = size 1650 900, match:class Spotify
windowrule = center on, match:class Spotify
windowrule = workspace special:spotify silent, match:class Spotify

# Docker Desktop
windowrule = float on, match:class Docker Desktop
windowrule = size 1650 900, match:class Docker Desktop
windowrule = center on, match:class Docker Desktop
windowrule = workspace special:docker silent, match:class Docker Desktop

# GitHub
windowrule = float on, match:class GitHub Desktop
windowrule = size 1650 900, match:class GitHub Desktop
windowrule = center on, match:class GitHub Desktop
windowrule = workspace special:github silent, match:class GitHub Desktop

# Drop-down terminal (Super + `) — kitty launched with --class=kitty-special
# pinned to its own special workspace so toggle-or-launch.sh can find it.
windowrule = float on, match:class kitty-special
windowrule = size 1650 900, match:class kitty-special
windowrule = center on, match:class kitty-special
windowrule = workspace special:term silent, match:class kitty-special

# NOTE: rerouting "rogue" windows that spawn onto a special workspace
# (e.g. an app launched from the launcher while special:term is visible)
# is handled by scripts/special-workspace-guard.sh — `match:workspace`
# rules don't fire for windows being mapped, so the IPC listener does it
# instead. Keep this comment so the next agent doesn't re-add a rule here.

# Livepaper
windowrule = float on, match:class livepaper
windowrule = size 1650 900, match:class livepaper
windowrule = center on, match:class livepaper
windowrule = workspace special:livepaper silent, match:class livepaper
